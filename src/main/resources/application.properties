spring.application.name=production-api

server.port=8081

spring.datasource.url=jdbc:aws-wrapper:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:production_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=software.amazon.jdbc.Driver

spring.datasource.hikari.data-source-properties.wrapperPlugins=initialConnection,failover2,iam
spring.datasource.hikari.data-source-properties.wrapperDialect=aurora-pg

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info